name: Build & Publish Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            target_deb: touch-grass-sim_1.0.0_amd64.deb
            pkg_dir: pkg_amd64
          - os: ubuntu-latest
            arch: arm64
            target_deb: touch-grass-sim_1.0.0_arm64.deb
            pkg_dir: pkg_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput

      - name: Build Standalone Executable Binary
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name touch-grass-sim \
            main.py

      - name: Setup Debian Package Directory Structure
        run: |
          # Copy built binary into the debian staging folder structure
          mkdir -p ${{ matrix.pkg_dir }}/usr/bin/
          cp -r dist/touch-grass-sim/* ${{ matrix.pkg_dir }}/usr/bin/
          chmod +x ${{ matrix.pkg_dir }}/usr/bin/touch-grass-sim
          chmod +x ${{ matrix.pkg_dir }}/DEBIAN/postinst

      - name: Build Debian Package
        run: |
          dpkg-deb --build ${{ matrix.pkg_dir }} ${{ matrix.target_deb }}

      - name: Upload Artifacts for Release Job
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-${{ matrix.arch }}
          path: ${{ matrix.target_deb }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}