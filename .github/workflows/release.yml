name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt || pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name='touch-grass-sim' main.py

      - name: Build AMD64 Debian Package
        run: |
          mkdir -p pkg_amd64/DEBIAN
          mkdir -p pkg_amd64/usr/bin
          mkdir -p pkg_amd64/usr/share/applications

          cp dist/touch-grass-sim pkg_amd64/usr/bin/

          cat << 'EOF' > pkg_amd64/DEBIAN/control
          Package: touch-grass-sim
          Version: 1.0.0
          Architecture: amd64
          Maintainer: yg7205
          Depends: zenity, xxd
          Description: Anti-doomscroll break timer with automated setup wizard.
          EOF

          cat << 'EOF' > pkg_amd64/usr/share/applications/touch-grass-sim.desktop
          [Desktop Entry]
          Type=Application
          Name=Touch Grass SIM
          Comment=Anti-doomscroll break timer and mindfulness tracker
          Exec=/usr/bin/touch-grass-sim
          Icon=preferences-system-time
          Terminal=false
          Categories=Utility;
          EOF

          cat << 'EOF' > pkg_amd64/DEBIAN/postinst
          #!/bin/bash
          set -e

          DESKTOP_USER=$(who | grep -E '\(:[0-9]\)' | awk '{print $1}' | head -n 1)
          [ -z "$DESKTOP_USER" ] && DESKTOP_USER="${SUDO_USER:-$(logname 2>/dev/null || echo '')}"
          USER_ID=$(id -u "$DESKTOP_USER" 2>/dev/null || echo "1000")

          export DISPLAY=:0
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$USER_ID/bus"

          if su "$DESKTOP_USER" -c "zenity --question --title='Touch Grass SIM Setup Wizard' --text='Welcome to Touch Grass SIM!\n\nWould you like to enable activity tracking to help schedule breaks?' --width=400" 2>/dev/null; then
              TRACKING=true
          else
              TRACKING=false
          fi

          echo 'KERNEL=="event*", NAME="input/%k", MODE="0644", TAG+="uaccess"' > /etc/udev/rules.d/99-touch-grass-sim.rules
          udevadm control --reload-rules || true
          udevadm trigger || true

          [ -n "$DESKTOP_USER" ] && [ "$DESKTOP_USER" != "root" ] && usermod -aG input "$DESKTOP_USER" || true

          mkdir -p /etc/touch-grass-sim
          AUTH_KEY=$(head -c 16 /dev/urandom | xxd -p 2>/dev/null || echo "TG-$(date +%s)")
          echo "{\"tracking_enabled\": $TRACKING, \"auth_key\": \"$AUTH_KEY\"}" > /etc/touch-grass-sim/config.json

          update-desktop-database /usr/share/applications 2>/dev/null || true
          gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true

          su "$DESKTOP_USER" -c "zenity --info --title='Touch Grass SIM Installed!' --text='Setup complete!\n\nHotkey (Ctrl+Alt+G) and permissions registered successfully.' --width=400" 2>/dev/null || true

          exit 0
          EOF

          chmod 755 pkg_amd64/DEBIAN/postinst
          dpkg-deb --build pkg_amd64 touch-grass-sim_1.0.0_amd64.deb

      - name: Upload AMD64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: touch-grass-sim_1.0.0_amd64.deb
          path: touch-grass-sim_1.0.0_amd64.deb

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt || pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name='touch-grass-sim' main.py

      - name: Build ARM64 Debian Package
        run: |
          mkdir -p pkg_arm64/DEBIAN
          mkdir -p pkg_arm64/usr/bin
          mkdir -p pkg_arm64/usr/share/applications

          cp dist/touch-grass-sim pkg_arm64/usr/bin/

          cat << 'EOF' > pkg_arm64/DEBIAN/control
          Package: touch-grass-sim
          Version: 1.0.0
          Architecture: arm64
          Maintainer: yg7205
          Depends: zenity, xxd
          Description: Anti-doomscroll break timer with automated setup wizard.
          EOF

          cat << 'EOF' > pkg_arm64/usr/share/applications/touch-grass-sim.desktop
          [Desktop Entry]
          Type=Application
          Name=Touch Grass SIM
          Comment=Anti-doomscroll break timer and mindfulness tracker
          Exec=/usr/bin/touch-grass-sim
          Icon=preferences-system-time
          Terminal=false
          Categories=Utility;
          EOF

          cat << 'EOF' > pkg_arm64/DEBIAN/postinst
          #!/bin/bash
          set -e

          DESKTOP_USER=$(who | grep -E '\(:[0-9]\)' | awk '{print $1}' | head -n 1)
          [ -z "$DESKTOP_USER" ] && DESKTOP_USER="${SUDO_USER:-$(logname 2>/dev/null || echo '')}"
          USER_ID=$(id -u "$DESKTOP_USER" 2>/dev/null || echo "1000")

          export DISPLAY=:0
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$USER_ID/bus"

          if su "$DESKTOP_USER" -c "zenity --question --title='Touch Grass SIM Setup Wizard' --text='Welcome to Touch Grass SIM!\n\nWould you like to enable activity tracking to help schedule breaks?' --width=400" 2>/dev/null; then
              TRACKING=true
          else
              TRACKING=false
          fi

          echo 'KERNEL=="event*", NAME="input/%k", MODE="0644", TAG+="uaccess"' > /etc/udev/rules.d/99-touch-grass-sim.rules
          udevadm control --reload-rules || true
          udevadm trigger || true

          [ -n "$DESKTOP_USER" ] && [ "$DESKTOP_USER" != "root" ] && usermod -aG input "$DESKTOP_USER" || true

          mkdir -p /etc/touch-grass-sim
          AUTH_KEY=$(head -c 16 /dev/urandom | xxd -p 2>/dev/null || echo "TG-$(date +%s)")
          echo "{\"tracking_enabled\": $TRACKING, \"auth_key\": \"$AUTH_KEY\"}" > /etc/touch-grass-sim/config.json

          update-desktop-database /usr/share/applications 2>/dev/null || true
          gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true

          su "$DESKTOP_USER" -c "zenity --info --title='Touch Grass SIM Installed!' --text='Setup complete!\n\nHotkey (Ctrl+Alt+G) and permissions registered successfully.' --width=400" 2>/dev/null || true

          exit 0
          EOF

          chmod 755 pkg_arm64/DEBIAN/postinst
          dpkg-deb --build pkg_arm64 touch-grass-sim_1.0.0_arm64.deb

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: touch-grass-sim_1.0.0_arm64.deb
          path: touch-grass-sim_1.0.0_arm64.deb

  release:
    needs: [build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download AMD64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: touch-grass-sim_1.0.0_amd64.deb

      - name: Download ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: touch-grass-sim_1.0.0_arm64.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            touch-grass-sim_1.0.0_amd64.deb
            touch-grass-sim_1.0.0_arm64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}