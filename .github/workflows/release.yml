name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: touch-grass-sim-linux
          - os: windows-latest
            asset_name: touch-grass-sim-windows
          - os: macos-latest
            asset_name: touch-grass-sim-mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # --- LINUX BUILD (.deb packages) ---
      - name: Build Linux .deb Packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          dpkg-deb --build pkg_arm64 touch-grass-sim_1.0.0_arm64.deb
          dpkg-deb --build pkg_amd64 touch-grass-sim_1.0.0_amd64.deb

      # --- WINDOWS BUILD (.exe) ---
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name="Touch-Grass-Sim" main.py

      # --- MACOS BUILD (.app / executable) ---
      - name: Build macOS Application
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --windowed --name="Touch-Grass-Sim" main.py

      # --- UPLOAD TO GITHUB RELEASES ---
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}