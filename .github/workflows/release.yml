name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Multi-Platform Packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            pkg_dir: pkg_amd64
            target_deb: touch-grass-sim_1.0.0_amd64.deb
          - os: ubuntu-latest
            platform: linux-arm64
            pkg_dir: pkg_arm64
            target_deb: touch-grass-sim_1.0.0_arm64.deb
          - os: windows-latest
            platform: windows-amd64
          - os: macos-latest
            platform: macos-universal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- LINUX BUILD (.deb packages) ---
      - name: Build Debian Package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          chmod +x ${{ matrix.pkg_dir }}/DEBIAN/postinst || true
          dpkg-deb --build ${{ matrix.pkg_dir }} ${{ matrix.target_deb }}

      # --- WINDOWS BUILD (.exe) ---
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput
          pyinstaller --noconfirm --onefile --windowed --name "Touch-Grass-Sim-Installer" main.py

      # --- MACOS BUILD (.app bundle) ---
      - name: Build macOS Application
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput
          pyinstaller --noconfirm --windowed --name "Touch-Grass-Sim" main.py

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: |
            *.deb
            dist/*.exe
            dist/*.app

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}