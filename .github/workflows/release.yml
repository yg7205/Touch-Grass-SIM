name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            pkg_dir: pkg_amd64
            target_deb: touch-grass-sim_1.0.0_amd64.deb
          - os: ubuntu-latest
            arch: arm64
            pkg_dir: pkg_arm64
            target_deb: touch-grass-sim_1.0.0_arm64.deb
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: universal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux Debian Package Build
      - name: Build Debian Package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          chmod +x ${{ matrix.pkg_dir }}/DEBIAN/postinst || true
          printf "\n" >> ${{ matrix.pkg_dir }}/DEBIAN/control
          dpkg-deb --build ${{ matrix.pkg_dir }} ${{ matrix.target_deb }}

      # Windows Executable Build
      - name: Build Windows Binary
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput Pillow
          pyinstaller --noconfirm --onefile --windowed --name "Touch-Grass-Sim-Installer" main.py

      # macOS App Bundle Build
      - name: Build macOS Application
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput Pillow
          pyinstaller --noconfirm --windowed --name "Touch-Grass-Sim" main.py

      # Upload Build Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-${{ matrix.arch }}-${{ runner.os }}
          path: |
            *.deb
            dist/*.exe
            dist/*.app

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}