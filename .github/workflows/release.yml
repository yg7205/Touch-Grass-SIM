name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Multi-OS Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_type: deb
            arch: amd64
            pkg_dir: pkg_amd64
            output_name: touch-grass-sim_1.0.1_amd64.deb
          - os: ubuntu-latest
            asset_type: deb
            arch: arm64
            pkg_dir: pkg_arm64
            output_name: touch-grass-sim_1.0.1_arm64.deb
          - os: windows-latest
            asset_type: exe
            output_name: Touch-Grass-Sim-Windows-x64.zip
          - os: macos-latest
            asset_type: macos
            output_name: Touch-Grass-Sim-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- LINUX DEBIAN BUILD ---
      - name: Build Debian Package
        if: matrix.asset_type == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-pil
          
          mkdir -p ${{ matrix.pkg_dir }}/usr/bin
          cp main.py ${{ matrix.pkg_dir }}/usr/bin/touch-grass-sim
          chmod +x ${{ matrix.pkg_dir }}/usr/bin/touch-grass-sim
          
          mkdir -p ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets
          cp -f anime.png ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets/ 2>/dev/null || true
          cp -f ghibli.png ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets/ 2>/dev/null || true
          cp -f wind.mp3 ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets/ 2>/dev/null || true

          chmod +x ${{ matrix.pkg_dir }}/DEBIAN/postinst || true
          printf "\n" >> ${{ matrix.pkg_dir }}/DEBIAN/control
          dpkg-deb --build ${{ matrix.pkg_dir }} ${{ matrix.output_name }}

      # --- WINDOWS EXE BUILD ---
      - name: Build Windows Executable
        if: matrix.asset_type == 'exe'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput Pillow pygame
          pyinstaller --noconfirm --onedir --windowed --add-data "anime.png;." --add-data "ghibli.png;." --add-data "wind.mp3;." --name "Touch-Grass-Sim" main.py
          Compress-Archive -Path home/phoenix/touch-grass/dist/touch-grass-sim -DestinationPath home/phoenix/touch-grass/dist/touch-grass-sim-Windows-x64.zip

      # --- MACOS ZIP BUILD ---
      - name: Build macOS App Bundle
        if: matrix.asset_type == 'macos'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput Pillow pygame
          pyinstaller --noconfirm --windowed --add-data "anime.png:." --add-data "ghibli.png:." --add-data "wind.mp3:." --name "Touch-Grass-Sim" main.py
          cd dist && zip -r ../touch-grass-sim-macOS.zip Touch-Grass-Sim.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.os }}-${{ matrix.arch || 'sys' }}
          path: |
            *.deb
            dist/*.zip
            *.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}