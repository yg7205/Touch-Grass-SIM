name: Build Cross-Platform Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput plyer
      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --noconsole --name="TouchGrassSetup" main.py
      - name: Upload Windows Executable to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/TouchGrassSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput plyer
          brew install create-dmg
      - name: Build macOS Binary & DMG
        run: |
          pyinstaller --onefile --noconsole --name="TouchGrassSim" main.py
          create-dmg --volname "Touch Grass SIM" --window-size 500 300 "TouchGrassSim.dmg" "dist/"
      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v1
        with:
          files: TouchGrassSim.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}