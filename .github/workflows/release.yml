name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-OS Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux Debian AMD64
          - os: ubuntu-latest
            asset_type: deb
            arch: amd64
            pkg_dir: pkg_amd64
            output_name: touch-grass-sim_1.0.0_amd64.deb

          # 2. Linux Debian ARM64
          - os: ubuntu-latest
            asset_type: deb
            arch: arm64
            pkg_dir: pkg_arm64
            output_name: touch-grass-sim_1.0.0_arm64.deb

          # 3. Windows x64 Executable
          - os: windows-latest
            asset_type: exe
            arch: x64
            output_name: Touch-Grass-Sim-Windows-x64.zip

          # 4. macOS Universal App Bundle
          - os: macos-latest
            asset_type: macos
            arch: universal
            output_name: Touch-Grass-Sim-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- BUILD LINUX DEBIAN PACKAGES (AMD64 & ARM64) ---
      - name: Build Debian Package (${{ matrix.arch }})
        if: matrix.asset_type == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-pil
          
          mkdir -p ${{ matrix.pkg_dir }}/usr/bin
          cp main.py ${{ matrix.pkg_dir }}/usr/bin/touch-grass-sim
          chmod +x ${{ matrix.pkg_dir }}/usr/bin/touch-grass-sim
          
          mkdir -p ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets
          mkdir -p ${{ matrix.pkg_dir }}/usr/share/icons/hicolor/256x256/apps
          
          cp -f anime.png ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets/ || true
          cp -f ghibli.png ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets/ || true
          cp -f icon.png ${{ matrix.pkg_dir }}/usr/share/touch-grass-sim/assets/ || true
          cp -f icon.png ${{ matrix.pkg_dir }}/usr/share/icons/hicolor/256x256/apps/touch-grass-sim.png || true

          chmod 755 ${{ matrix.pkg_dir }}/DEBIAN/postinst || true
          chmod 644 ${{ matrix.pkg_dir }}/DEBIAN/control
          dpkg-deb --build ${{ matrix.pkg_dir }} ${{ matrix.output_name }}

      # --- BUILD WINDOWS EXE ---
      - name: Build Windows Executable
        if: matrix.asset_type == 'exe'
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput Pillow
          pyinstaller --noconfirm --onedir --windowed --add-data "anime.png;." --add-data "ghibli.png;." --add-data "icon.png;." --name "Touch-Grass-Sim" main.py
          Compress-Archive -Path dist\Touch-Grass-Sim -DestinationPath Touch-Grass-Sim-Windows-x64.zip

      # --- BUILD MACOS APP BUNDLE ---
      - name: Build macOS App Bundle
        if: matrix.asset_type == 'macos'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput Pillow
          pyinstaller --noconfirm --windowed --add-data "anime.png:." --add-data "ghibli.png:." --add-data "icon.png:." --name "Touch-Grass-Sim" main.py
          cd dist && zip -r ../Touch-Grass-Sim-macOS.zip Touch-Grass-Sim.app

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.deb
            *.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}